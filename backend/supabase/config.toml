project_id = "on-time-taxi"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600

[auth.sms]
enable_signup = true
enable_confirmations = true

[functions.quote-fare]
verify_jwt = false

[functions.dispatch-ride]
verify_jwt = true

[functions.square-webhook]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false
